<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>贪吃蛇</title>
<style>
*{margin:0;padding:0}
canvas{background:#111;display:block;margin:10px auto;}
</style>
</head>
<body>
<canvas id="game" width="400" height="400"></canvas>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let size=20,snake=[{x:10,y:10}],dx=1,dy=0,food={x:15,y:15},over=false;
function rand(){return Math.floor(Math.random()*20)}
function draw(){
  if(over){ctx.fillStyle="#fff";ctx.fillText("游戏结束，空格重开",120,200);return;}
  ctx.fillStyle="#111";ctx.fillRect(0,0,400,400);
  ctx.fillStyle="#0f0";
  snake.forEach(p=>ctx.fillRect(p.x*size,p.y*size,size-2,size-2));
  ctx.fillStyle="#f33";
  ctx.fillRect(food.x*size,food.y*size,size-2,size-2);
  let head={x:snake[0].x+dx,y:snake[0].y+dy};
  if(head.x<0||head.y<0||head.x>=20||head.y>=20||snake.some(i=>i.x===head.x&&i.y===head.y))over=true;
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y)food={x:rand(),y:rand()};
  else snake.pop();
}
document.onkeydown=e=>{
  if(e.key===' '&&over){snake=[{x:10,y:10}];dx=1;dy=0;over=false;food={x:rand(),y:rand()}}
  if(e.key==='ArrowUp'&&dy!==1){dx=0;dy=-1}
  if(e.key==='ArrowDown'&&dy!==-1){dx=0;dy=1}
  if(e.key==='ArrowLeft'&&dx!==1){dx=-1;dy=0}
  if(e.key==='ArrowRight'&&dx!==-1){dx=1;dy=0}
}
setInterval(draw,120);
</script>
</body>
</html>
